let CH={};
function dc(a){Object.values(CH).forEach(c=>c&&c.destroy());CH={};}
function s(a){return a.reduce((x,y)=>x+y,0);}
function f(v){if(!v||v===0)return'—';return v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fp(v){const p=(v*100).toFixed(2);const c=v>0.95?'pr':v>0.85?'pl':'pv';return`<span class="${c}">${p}%</span>`;}
function ci(v){return v>=0.95?'#C0392B':v>=0.85?'#E8A020':v>=0.70?'#d4ac0d':'#1E7B4B';}

function trocar(m,b){document.querySelectorAll('.mes-btn').forEach(x=>x.classList.remove('ativo'));b.classList.add('ativo');render(m);}

function render(m){
  const d=D[m],dm=d.desp_total_mes,rm=d.rec,ix=d.idxMes,n=d.meses.length;
  const ic=d.idxTot>0.95?'critico':d.idxTot>0.85?'alerta':'ok';
  document.getElementById('ind').innerHTML=`
    <div class="ind-card ${ic}">
      <div class="ind-label">Índice 12 Meses</div>
      <div class="ind-valor">${(d.idxTot*100).toFixed(2)}%</div>

      <div class="ind-label">Receita Corrente — 12 meses</div>
      <div class="ind-valor" style="font-size:15px;color:#1B3A6B">R$ ${f(d.recN)}</div>
      <div class="ind-sub">Período: ${d.periodo}</div>
    </div>
    <div class="ind-card">
      <div class="ind-label">Despesa Corrente — 12 meses</div>
      <div class="ind-valor" style="font-size:15px;color:#2E5FA3">R$ ${f(d.despTotN)}</div>
      <div class="ind-sub">Inclui RPNP: R$ ${f(d.rpnp_N)}</div>
    </div>
    <div class="ind-card">
      <div class="ind-label">RPNP — Restos a Pagar NP</div>
      <div class="ind-valor" style="font-size:15px;color:#2E5FA3">R$ ${f(d.rpnp_N)}</div>
      <div class="ind-sub">Saldo 31/12/2025 − cancelamentos acumulados</div>
    </div>`;

  const th=`<th>ESPECIFICAÇÃO</th>${d.meses.map(x=>`<th>${x}</th>`).join('')}<th class="col-tot">TOTAL 12M</th>`;
  function row(l,vs,t,o={}){
    const c=o.b?'ln':'';const lc=o.i?'indent':'';
    return`<tr class="${c}"><td class="${lc}">${l}</td>${vs.map(v=>`<td>${f(v)}</td>`).join('')}<td class="col-tot">${f(t)}</td></tr>`;
  }
  function rowp(l,vs,t){return`<tr class="lp"><td>${l}</td>${vs.map(v=>`<td>${fp(v)}</td>`).join('')}<td class="col-tot">${fp(t)}</td></tr>`;}
  function rowl(l,v,c){return`<tr class="${c}"><td>${l}</td>${d.meses.map(()=>'<td>—</td>').join('')}<td class="col-tot">${fp(v)}</td></tr>`;}
  const rb=d.meses.map(()=>'<td>—</td>').join('');

  const ac=ix.filter(v=>v>=0.95).length;
  const ci2=ix.indexOf(Math.max(...ix)),co=ix.indexOf(Math.min(...ix));
  dc();

  document.getElementById('main').innerHTML=`<div class="fade-in">
  <div class="bloco-titulo">Receitas Correntes — ${d.periodo}</div>
  <div class="tbl-wrap"><table><thead><tr>${th}</tr></thead><tbody>
  ${row("Receitas Correntes (I)",rm.map((_,i)=>d.r7[i]+d.r8[i]+d.r9[i]+d.r10[i]+d.r11[i]+d.r12[i]),s(d.r7)+s(d.r8)+s(d.r9)+s(d.r10)+s(d.r11)+s(d.r12),{b:1})}
  ${row("1.1 Impostos, Taxas e Contrib. Melhoria",d.r7,d.r7N,{i:1})}
  ${row("1.2 Contribuições",d.r8,d.r8N,{i:1})}
  ${row("1.3 Receita Patrimonial",d.r9,d.r9N,{i:1})}
  ${row("1.6 Receita de Serviços",d.r10,d.r10N,{i:1})}
  ${row("1.7 Transferências Correntes",d.r11,d.r11N,{i:1})}
  ${row("1.9 Outras Receitas Correntes",d.r12,d.r12N,{i:1})}
  ${row("7.1 Rec. Correntes Intraorçamentárias (II)",d.r13,d.r13N,{i:1})}

  </tbody></table></div>
  <div class="sp"></div>
  <div class="bloco-titulo">Despesas Correntes</div>
  <div class="tbl-wrap"><table><thead><tr>${th}</tr></thead><tbody>
  ${row("Despesas Correntes (III)",dm.map((_,i)=>d.pessoal[i]+d.juros[i]+d.outras[i]),d.despCorN,{b:1})}
  ${row("   Pessoal e Encargos Sociais",d.pessoal,d.pessoalN,{i:1})}
  ${row("   Juros e Encargos da Dívida",d.juros,d.jurosN,{i:1})}
  ${row("   Outras Despesas Correntes",d.outras,d.outrasN,{i:1})}
  ${row("Despesas Correntes Intraorçamentárias (IV)",d.intra,d.intraN)}
  <tr class="rpnp"><td>Restos a Pagar Não Processados (V)</td>${rb}<td class="col-tot">${f(d.rpnp_N)}</td></tr>
  ${row("TOTAL DESPESAS CORRENTES (III + IV + V)",dm,d.despTotN,{b:1})}
  </tbody></table></div>
  <div class="sp"></div>
  <div class="bloco-titulo">Apuração do Cumprimento do Limite Legal — Art. 167-A CF</div>
  <div class="tbl-wrap"><table><thead><tr>${th}</tr></thead><tbody>
  ${row("Receitas Correntes Totais (V)",rm,d.recN)}
  ${row("Despesas Correntes Totais (VI)",dm,d.despTotN)}
  ${rowp("(%) Desp. Correntes / Rec. Correntes",ix,d.idxTot)}
  ${rowl("LIMITE PRUDENCIAL DO PERÍODO",0.85,"lpru")}
  ${rowl("LIMITE MÁXIMO DO PERÍODO",0.95,"lmax")}
  </tbody></table></div>
  <div class="sp"></div>
  <div class="bloco-titulo">Análise Visual — Período: ${d.periodo}</div>
  <div class="graficos-grid">
    <div class="gc gf alto"><div class="gt">Composição das Despesas Correntes vs Receitas Correntes</div><canvas id="cB"></canvas></div>
    <div class="gc gf"><div class="gt">Despesa Corrente / Receita Corrente por Mês (%)</div><canvas id="cL"></canvas></div>
    <div class="gc"><div class="gt">Composição das Receitas Correntes</div><canvas id="cPR"></canvas></div>
    <div class="gc"><div class="gt">Composição das Despesas Correntes</div><canvas id="cPD"></canvas></div>
  </div>
  <div class="cards-resumo">

    <div class="cr cr-g"><div class="cr-t">Mês Mais Confortável</div><div class="cr-v" style="color:#1E7B4B;font-size:15px">${d.meses[co]}</div><div class="cr-s">${(ix[co]*100).toFixed(1)}%</div></div>
  </div>
  <div class="nota"><strong>Notas Explicativas:</strong>
  1 — O art. 167-A da CF institui regra fiscal que, ao se apurar valor superior a 95% da relação Desp/Rec em 12 meses, faculta mecanismos de ajuste fiscal.

  3 — Inclui Receitas e Despesas Intraorçamentárias conforme Nota Técnica SEI nº 57.145/2022/ME/STN.
  4 — Fonte: RREO Anexo 3 e Demonstrativo da Despesa por Período — Prefeitura Municipal de Porto Velho / SEMEC.</div>
  </div>`;

  CH.B=new Chart(document.getElementById('cB').getContext('2d'),{type:'bar',data:{labels:d.meses,datasets:[
    {label:'Pessoal',data:d.pessoal.map(v=>+(v/1e6).toFixed(1)),backgroundColor:'#2471a3',stack:'d'},
    {label:'Juros',data:d.juros.map(v=>+(v/1e6).toFixed(1)),backgroundColor:'#c0392b',stack:'d'},
    {label:'Outras DC',data:d.outras.map(v=>+(v/1e6).toFixed(1)),backgroundColor:'#27ae60',stack:'d'},
    {label:'Intraorç.',data:d.intra.map(v=>+(v/1e6).toFixed(1)),backgroundColor:'#8e44ad',stack:'d'},
    {label:'Receita Corrente',data:rm.map(v=>+(v/1e6).toFixed(1)),type:'line',borderColor:'#1a1a2e',
     backgroundColor:'transparent',pointBackgroundColor:'#1a1a2e',borderWidth:2.5,pointRadius:4,tension:.3}
  ]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{position:'top',labels:{font:{size:9},boxWidth:10}}},

  CH.L=new Chart(document.getElementById('cL').getContext('2d'),{type:'line',data:{labels:d.meses,datasets:[{

  scales:{x:{ticks:{font:{size:8}}},
  y:{min:Math.max(40,Math.min(...ix.map(v=>v*100))-8),
     ticks:{callback:v=>`${v}%`,font:{size:8}},grid:{color:'rgba(0,0,0,.05)'}}}},
  plugins:[{id:'lims',afterDraw(c){
    const {ctx,chartArea:{left,right},scales:{y}}=c;
    [{v:85,col:'#E8A020'},{v:95,col:'#C0392B'}].forEach(({v,col})=>{
      const yp=y.getPixelForValue(v);
      ctx.save();ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.setLineDash([6,4]);

      ctx.fillStyle=col;ctx.font='9px sans-serif';ctx.fillText(v+'%',right+4,yp+3);ctx.restore();
    });
  }}]});

  const lblR=['Impostos','Contrib.','Patrimonial','Serviços','Transferências','Outras','Intraorç.'];

    backgroundColor:clrR,borderColor:'white',borderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{position:'bottom',labels:{font:{size:8},boxWidth:9,padding:6}},
    tooltip:{callbacks:{label:c=>`${c.label}: R$${c.parsed.toFixed(1)}M`}}}}});

  CH.PD=new Chart(document.getElementById('cPD').getContext('2d'),{type:'pie',data:{labels:['Pessoal','Juros','Outras DC','Intraorç.'],datasets:[{
    data:[d.pessoalN,d.jurosN,d.outrasN,d.intraN].map(v=>+(v/1e6).toFixed(1)),
    backgroundColor:['#2471a3','#c0392b','#27ae60','#8e44ad'],borderColor:'white',borderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{position:'bottom',labels:{font:{size:8},boxWidth:9,padding:6}},
